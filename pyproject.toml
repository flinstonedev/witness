[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-benchmark"
version = "0.2.0"
description = "A falsifiable, evidence-level benchmark for query-compiled proof-carrying retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Witness benchmark contributors" }]
dependencies = []

[project.scripts]
witness-bench = "witness_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["witness_bench*", "witness_engine*"]
