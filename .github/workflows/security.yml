name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard regression tests
        run: python3 -m unittest discover -s tests -p 'test_repository_hygiene.py' -v
      - name: Inspect reachable history
        run: python3 scripts/check_repository_hygiene.py
      - name: Scan secrets with checksum-verified Gitleaks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          HYGIENE_TMP=$(mktemp -d "$RUNNER_TEMP/repository-hygiene.XXXXXX")
          curl --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$HYGIENE_TMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$HYGIENE_TMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$HYGIENE_TMP/gitleaks.tar.gz" -C "$HYGIENE_TMP" gitleaks
          mkdir "$HYGIENE_TMP/no-ignore"
          printf '[extend]\nuseDefault = true\n' > "$HYGIENE_TMP/config.toml"
          set +e
          "$HYGIENE_TMP/gitleaks" git . \
            --config="$HYGIENE_TMP/config.toml" \
            --gitleaks-ignore-path="$HYGIENE_TMP/no-ignore" \
            --ignore-gitleaks-allow \
            --redact=100 --log-opts=--all --max-target-megabytes=0 --no-banner \
            --report-format=json --report-path="$HYGIENE_TMP/findings.json" \
            > "$HYGIENE_TMP/scanner.log" 2>&1
          HYGIENE_STATUS=$?
          set -e
          python3 - "$HYGIENE_TMP/findings.json" "$HYGIENE_STATUS" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          status = int(sys.argv[2])
          try:
              findings = json.loads(Path(sys.argv[1]).read_text())
              if not isinstance(findings, list):
                  raise ValueError()
              for item in findings:
                  if not isinstance(item, dict):
                      raise ValueError()
                  rule = str(item.get('RuleID', ''))
                  commit = str(item.get('Commit', ''))
                  line = item.get('StartLine')
                  rule = rule if re.fullmatch(r'[A-Za-z0-9_.-]{1,128}', rule) else 'unknown'
                  commit = commit if re.fullmatch(r'[0-9a-f]{40,64}', commit) else 'unknown'
                  line = line if isinstance(line, int) else 0
                  print(f'credential_candidate rule:{rule} commit:{commit} line:{line}')
          except (OSError, ValueError, TypeError):
              print('Secret scan could not be inspected; diagnostic values withheld.')
              raise SystemExit(2)
          if status not in (0, 1):
              print('Secret scan failed; diagnostic values withheld.')
              raise SystemExit(2)
          print(f'Secret scan: {len(findings)} candidate(s). No credential values or filenames printed.')
          raise SystemExit(1 if findings or status else 0)
          PY
